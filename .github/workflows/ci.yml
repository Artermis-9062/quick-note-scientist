name: CI

on:
  pull_request:
    branches:
      - main
      - mvp-feat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      # Coverage also runs all required regression tests; do not silently skip them.
      - name: Run unit tests and coverage
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      - name: Build production bundle
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Run end-to-end tests
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      # Upload reports even while regression tests intentionally fail during Stage 1.
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: math-test-reports
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
